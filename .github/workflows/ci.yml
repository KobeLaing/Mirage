name: CI

on:
  push:
  pull_request:

# Least privilege (SR-19): every job can only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + Bandit + pip-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Third-party actions are pinned to full commit SHAs (tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest
      - name: Bandit (Python static security analysis)
        run: python -m bandit -c pyproject.toml -r app scripts run.py
      - name: pip-audit (known vulnerabilities in dependencies)
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt --strict

  frontend:
    name: Frontend lint + typecheck + npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (lockfile only, no install scripts)
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: npm audit (runtime dependencies, blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all dependencies, report only)
        # Dev-only lint tooling currently has an advisory with no patched release
        # (see docs/threat-model.md). Reported here; does not fail the build.
        run: npm audit --audit-level=high || echo "::warning::npm audit reported dev-dependency findings"

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the action lists a PR's commits to scan them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: scan every commit, not just the latest
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for repositories owned by an organization.
