[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    error::DeprecationWarning:app.*
    # Starlette now prefers the `httpx2` package for TestClient; `httpx` still works.
    # Switching is tracked in README "Known gaps" rather than adding a new dependency now.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
