<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Mirage">
  <title>Mirage</title>
  <!-- A cute square robot sliced by crisp horizontal "heat-shimmer" glitch bands.
       The robot is drawn once (#bot); each band re-draws it shifted sideways.
       Bands sit on the forehead, through the lower eyes and on the chin, so the
       smile and cheeks always stay intact. -->
  <defs>
    <g id="bot">
      <rect x="30.5" y="8" width="3" height="7" fill="#FDE7C2"/>
      <circle cx="32" cy="7" r="3.5" fill="#F5A524"/>
      <rect x="6.5" y="27" width="6" height="13" rx="2.5" fill="#F5A524"/>
      <rect x="51.5" y="27" width="6" height="13" rx="2.5" fill="#F5A524"/>
      <rect x="11" y="14" width="42" height="38" rx="9" fill="#FDE7C2"/>
      <rect x="16" y="20" width="32" height="24" rx="6" fill="#13294F"/>
      <rect x="21" y="25.5" width="7.5" height="9.5" rx="3.75" fill="#38BDF8"/>
      <rect x="35.5" y="25.5" width="7.5" height="9.5" rx="3.75" fill="#38BDF8"/>
      <circle cx="26.2" cy="28.3" r="1.5" fill="#FFFFFF"/>
      <circle cx="40.7" cy="28.3" r="1.5" fill="#FFFFFF"/>
      <path d="M27 38.2 Q32 42.2 37 38.2" fill="none" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="20.5" cy="39" r="2" fill="#F27B1A" opacity="0.85"/>
      <circle cx="43.5" cy="39" r="2" fill="#F27B1A" opacity="0.85"/>
    </g>
    <clipPath id="steady">
      <rect x="0" y="0" width="64" height="18"/>
      <rect x="0" y="21" width="64" height="11"/>
      <rect x="0" y="34.5" width="64" height="11.5"/>
      <rect x="0" y="49" width="64" height="15"/>
    </clipPath>
    <clipPath id="band1"><rect x="0" y="18" width="64" height="3"/></clipPath>
    <clipPath id="band2"><rect x="0" y="32" width="64" height="2.5"/></clipPath>
    <clipPath id="band3"><rect x="0" y="46" width="64" height="3"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0B1A33"/>
  <use href="#bot" clip-path="url(#steady)"/>
  <g clip-path="url(#band1)"><use href="#bot" x="3.5"/></g>
  <g clip-path="url(#band2)"><use href="#bot" x="-3"/></g>
  <g clip-path="url(#band3)"><use href="#bot" x="4.5"/></g>

  <g shape-rendering="crispEdges">
    <rect x="4" y="18" width="10" height="1.5" fill="#38BDF8"/>
    <rect x="49" y="20" width="11" height="1" fill="#38BDF8" opacity="0.8"/>
    <rect x="47" y="33" width="12" height="1.5" fill="#F27B1A"/>
    <rect x="3" y="32" width="8" height="1" fill="#F5A524" opacity="0.9"/>
    <rect x="5" y="47.5" width="9" height="1.2" fill="#F5A524"/>
  </g>
</svg>
